<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <h1>Tetris</h1>
            <p>Arcade-Mode mit Preview und Highscore</p>
        </header>

        <section class="hud">
            <article class="stat">
                <span class="stat-label">Score</span>
                <strong id="score">0</strong>
            </article>
            <article class="stat">
                <span class="stat-label">Lines</span>
                <strong id="lines">0</strong>
            </article>
            <article class="stat">
                <span class="stat-label">Level</span>
                <strong id="level">1</strong>
            </article>
            <article class="stat">
                <span class="stat-label">Highscore</span>
                <strong id="highscore">0</strong>
            </article>
        </section>

        <section class="game-stage">
            <div class="board-wrap">
                <canvas id="game"></canvas>
                <div class="stage-overlay" id="stage-overlay">
                    <p class="overlay-kicker" id="overlay-kicker">Bereit?</p>
                    <h2 id="overlay-title">Tetris starten</h2>
                    <p id="overlay-text">Druecke Enter, um das Spiel zu beginnen.</p>
                </div>
            </div>

            <aside class="side-panel">
                <section class="panel-card">
                    <span class="panel-label">Next Piece</span>
                    <canvas id="next-piece" width="120" height="120"></canvas>
                </section>

                <section class="panel-card panel-status">
                    <span class="panel-label">Status</span>
                    <strong id="status-text">Waiting</strong>
                    <button type="button" id="primary-action">Start</button>
                </section>
            </aside>
        </section>

        <footer class="controls">
            <span>Start: Enter</span>
            <span>Pause: P</span>
            <span>Bewegen: &larr; &rarr;</span>
            <span>Fallen: &darr;</span>
            <span>Drehen: &uarr;</span>
            <span>Hard Drop: Space</span>
            <span>AI Toggle: A</span>
            <span id="ai-status">AI: ON</span>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
