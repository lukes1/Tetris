<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <h1>Tetris</h1>
            <p>Stabiler Arcade-Mode</p>
        </header>

        <section class="hud">
            <article class="stat">
                <span class="stat-label">Score</span>
                <strong id="score">0</strong>
            </article>
            <article class="stat">
                <span class="stat-label">Lines</span>
                <strong id="lines">0</strong>
            </article>
            <article class="stat">
                <span class="stat-label">Level</span>
                <strong id="level">1</strong>
            </article>
        </section>

        <section class="game-stage">
            <canvas id="game"></canvas>
        </section>

        <footer class="controls">
            <span>Bewegen: &larr; &rarr;</span>
            <span>Fallen: &darr;</span>
            <span>Drehen: &uarr;</span>
            <span>Hard Drop: Space</span>
            <span>AI Toggle: A</span>
            <span id="ai-status">AI: ON</span>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
